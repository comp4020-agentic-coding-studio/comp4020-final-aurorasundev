name: checks

on:
  push:
    branches: [main]
  pull_request:
  # /ship dispatches a run after flipping the repo public, since the flip
  # itself triggers no push event.
  workflow_dispatch:

# One deploy at a time, and never cancel one mid-flight.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    # Runs once the repo is public; until then `pnpm check` is the same
    # sensors, locally.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so the secret scan can see all commits
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Build and start the app
        # the same image Fly deploys, with a throwaway /data in place of the
        # volume; the spec runs against it
        run: |
          docker build -t app .
          docker run -d --init --name app -p 8080:8080 -e PORT=8080 -e MODERATION_PROVIDER=fixture --tmpfs /data app
      - name: Run the spec
        run: pnpm check
        env:
          APP_URL: http://localhost:8080
      - name: Show the app's output
        # what the container printed, so a crash or slow boot is visible
        if: ${{ failure() }}
        run: docker logs app
      - name: Check the process evidence
        # skipped in the template repo itself, where PROCESS.md is still the
        # boilerplate every student replaces
        if: ${{ !github.event.repository.is_template }}
        run: pnpm check:evidence
      - name: Scan for committed secrets
        # Pinned in both halves (action SHA and scanner image) because this
        # runs in every repo in the course. Bump between semesters.
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          version: "3.96.0"
          extra_args: --only-verified
      - name: Scan for a committed course key
        # A course key has no verifier a runner can reach, so this pass
        # matches its shape instead (.github/trufflehog.yml).
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          version: "3.96.0"
          extra_args: >-
            --config=.github/trufflehog.yml
            --include-detectors=CustomRegex --results=unverified
            --no-verification

  deploy:
    needs: check
    # The template repo itself has no Fly app; only student repos deploy.
    if: ${{ !github.event.repository.private && !github.event.repository.is_template && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # Registers the GitHub Deployment with the live URL. The app is named
    # after this repo, so the URL needs no lookup.
    environment:
      name: fly
      url: https://${{ github.event.repository.name }}.fly.dev
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP_URL: https://${{ github.event.repository.name }}.fly.dev
    steps:
      - uses: actions/checkout@v7
      - name: Install flyctl
        # A pinned flyctl, fetched through the GitHub API's release asset with
        # retries. setup-flyctl asks api.fly.io for the version and then
        # downloads github.com/.../releases/download/...; on 2026-11-08 both
        # answered 504 to runners for hours while the API asset still served.
        env:
          FLYCTL_VERSION: "0.5.4"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="flyctl_${FLYCTL_VERSION}_Linux_x86_64.tar.gz"
          asset=$(curl -fsS --retry 5 --retry-all-errors --retry-delay 5 \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/superfly/flyctl/releases/tags/v${FLYCTL_VERSION}" \
            | jq -r --arg n "$name" '.assets[] | select(.name == $n) | .url')
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            -o /tmp/flyctl.tar.gz "$asset"
          mkdir -p "$HOME/.fly/bin"
          tar -xzf /tmp/flyctl.tar.gz -C "$HOME/.fly/bin" flyctl
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"
          "$HOME/.fly/bin/flyctl" version
      - name: Deploy
        # --remote-only builds the Dockerfile on Fly's builders; --ha=false
        # keeps the app at one machine and one volume.
        run: flyctl deploy --remote-only --ha=false -a ${{ github.event.repository.name }}
      - name: Verify the deployed site is online
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL" || true)
            if [ "$code" = "200" ]; then echo "online: $APP_URL"; exit 0; fi
            echo "attempt $i: HTTP $code, retrying in 10s..."
            sleep 10
          done
          echo "site did not return 200"; exit 1
